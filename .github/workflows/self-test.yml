name: Harness self-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  self-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run dependency-free self-test
        run: ./bin/harness-check --self-test

      - name: Run clean sample smoke-test
        working-directory: sample
        run: ../bin/harness-check --spec specs/001-example/spec.md

      - name: Scan package before build artifacts exist
        run: ./bin/harness-check --package-root .

      - name: Verify runtime version
        run: |
          test "$(PYTHONPATH=src python -c 'import dev_harness; print(dev_harness.__version__)')" = "$(cat VERSION)"

      - name: Build and inspect publish artifacts
        run: |
          python -m pip install --disable-pip-version-check --quiet build
          out="$(mktemp -d)"
          python -m build --outdir "$out"
          OUT_DIR="$out" python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          out = Path(os.environ["OUT_DIR"])
          files = [path for path in out.iterdir() if path.suffix in {".whl", ".gz"}]
          assert len(files) == 2, files
          expected = {
              "AGENTS.md",
              "VERSION",
              "schemas/ci-receipt.schema.json",
              "schemas/event-identity.schema.json",
              "schemas/release-train.schema.json",
              "templates/release-train.json",
              "skills/development-process/SKILL.md",
              "bin/harness-check",
          }
          sdist = next(path for path in files if path.suffix == ".gz")
          with tarfile.open(sdist) as archive:
              names = {name.split("/", 1)[1] for name in archive.getnames() if "/" in name}
          assert expected <= names, sorted(expected - names)
          wheel = next(path for path in files if path.suffix == ".whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          wheel_expected = {
              "development_process_harness-0.1.13.data/data/share/development-process-harness/AGENTS.md",
              "development_process_harness-0.1.13.data/data/share/development-process-harness/schemas/release-train.schema.json",
              "development_process_harness-0.1.13.data/data/share/development-process-harness/templates/release-train.json",
              "development_process_harness-0.1.13.data/data/share/development-process-harness/skills/development-process/SKILL.md",
          }
          assert wheel_expected <= names, sorted(wheel_expected - names)
          print("artifact-content: OK")
          PY
