[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "development-process-harness"
version = "0.1.2"
description = "Portable dependency-free governance validators"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.scripts]
harness-check = "dev_harness.validators:main"

[tool.setuptools.packages.find]
where = ["src"]
